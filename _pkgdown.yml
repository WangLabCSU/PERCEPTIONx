url: https://wanglabcsu.github.io/PERCEPTIONx/

template:
  bootstrap: 5
  bslib:
    # System font stack: no Google Fonts network request, so the page paints
    # immediately. Heading face stays serif (Georgia ships with macOS/Windows;
    # other OSes fall back to a generic serif).
    heading_font: "'Georgia', 'Times New Roman', serif"
    primary: "#165c91"
  includes:
    in_header: |
      <meta name="description" content="PERCEPTIONx — predict patient drug response and resistance from single-cell tumor transcriptomics.">

navbar:
  structure:
    left: [home, tutorial, reference, news]
    right: [github]
  components:
    home:
      text: Home
      href: index.html
    tutorial:
      text: Tutorial
      menu:
      - text: Shiny App Guide
        href: articles/shiny_app.html
      - text: R Package Tutorial
        href: articles/pipeline.html
    github:
      icon: fa-github
      href: https://github.com/WangLabCSU/PERCEPTIONx
      aria-label: GitHub

reference:
  - title: Data Loading
    desc: Download and load DepMap reference data and pre-trained models.
    contents:
      - load_depmap
      - load_model
      - get_depmap
      - get_mirrors
      - add_mirrors
      - list_mirrors
      - reset_mirrors
  - title: Preprocessing
    contents:
      - prepare_data
  - title: Model Training
    contents:
      - train_models
  - title: Prediction
    contents:
      - predict_drugs
      - predict_patients
  - title: Evaluation
    contents:
      - compare_performance
      - get_significant_models
      - get_performance
  - title: Visualization
    contents:
      - plot_tsne_response
      - plot_tsne_biomarker_viability
      - plot_clone_distribution
      - plot_clone_viability
      - plot_clone_umap
      - plot_model_performance
      - plot_model_roc
      - plot_roc_curve
      - plot_response_boxplot
      - plot_seurat_clustering
      - plot_patient_response_panel
  - title: Shiny Application
    contents:
      - run_perception_app
  - title: Advanced - Pipeline Building Blocks
    desc: Lower-level components used internally by train_models() and prepare_data(). Most users only need the main entry points above.
    contents:
      - rank_normalization_mat
      - range01
      - zscore_viability
      - get_response_matrix
      - get_cellLine_list
      - feature_ranking_bulk
      - run_parallel_feature_ranking_bulk
      - build_on_BULK_v2
      - each_patient_pseudo_bulk
      - annotate_clones
      - build_clone_counts
      - build_clone_key
      - parse_clone_keys
      - clone_mean_expression
  - title: Utilities
    contents:
      - hypergeometric_test_for_twolists
      - fdrcorr
      - cor.test_trimmed_v0
      - export_plot_cairo

articles:
  - title: Tutorials
    desc: Step-by-step guides for R package.
    contents:
      - pipeline
  - title: Shiny App Guide
    desc: Full walkthrough of the interactive web dashboard.
    contents:
      - shiny_app
  # Chinese mirror of the Shiny guide: kept in the repo but NOT listed on
  # the site (pkgdown "internal" sections are excluded from the index).
  - title: internal
    contents:
      - shiny_app_cn

footer:
  structure:
    left: [developed_by, built_with]
    right: [github, citation]
  components:
    developed_by: Developed by Jia Ding
    github: <a href="https://github.com/WangLabCSU/PERCEPTIONx">GitHub</a>
    citation: <a href="https://doi.org/10.1038/s43018-024-00756-7">Cite the paper</a>
